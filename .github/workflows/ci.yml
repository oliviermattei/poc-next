name: CI

# Tout ce que la Definition of Done exige, sur chaque push et chaque pull
# request. Un seul de ces contrôles en échec fait échouer le workflow : c'est le
# seul sens qu'ait un contrôle bloquant.
on:
  push:
  pull_request:

# Une exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typage, lint, tests, build (modules ${{ matrix.modules }})
    runs-on: ubuntu-latest

    # **Deux configurations, et pas une.** Un module optionnel se coupe, et le
    # dépôt promet qu'un module coupé ne laisse aucune trace : pas de route, pas
    # d'entrée de navigation, pas de migration sur une base fraîche. Une CI qui
    # ne joue qu'une configuration ne vérifie jamais cette moitié-là — et trois
    # revues de suite (s10, s15, s11) ont trouvé des gardes qui ne mordent que
    # dans l'état que la CI ne jouait pas. Une garde qui ne s'exécute jamais
    # dans la configuration où elle mord est de la documentation.
    strategy:
      fail-fast: false
      matrix:
        modules: [tous, socle]

    services:
      # La même image que `docker-compose.yml`, pour que la CI éprouve ce que le
      # développeur exécute. Sans le healthcheck, les migrations démarrent sur
      # une base qui n'écoute pas encore.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Aucun secret : une base jetable, dans le réseau du runner.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # La CI n'envoie aucun email réel : elle capture. Le drapeau est
      # explicite parce que l'absence de clé ne suffit pas à le décider.
      #
      # Mesuré, sans lui, dans l'ordre réel des étapes : migrations, tests
      # unitaires et build passent — ils ne montent aucun mailer, et le schéma
      # d'environnement n'en exige d'aucun processus — puis `pnpm test:e2e`
      # échoue, parce que Playwright démarre l'application et que celle-ci, elle,
      # refuse de démarrer sans avoir dit ce qu'elle fait de ses emails.
      #
      # Au niveau du job, et pas de la seule étape des parcours : y ajouter un
      # jour un secret `RESEND_API_KEY` casserait **toutes** les étapes qui
      # valident l'environnement, la clé et le drapeau étant exclusifs.
      EMAIL_LOCAL_CAPTURE: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` : l'installation échoue si le lockfile diverge du
      # `package.json`, au lieu de le réécrire en silence (socle de sécurité §6).
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # La configuration « socle » : tout ce qui est optionnel est coupé. Le CLI
      # refuse une coupure qui casserait un requis, donc l'ordre compte et
      # l'échec de cette étape est un vrai constat.
      - name: Couper les modules optionnels
        if: matrix.modules == 'socle'
        run: pnpm ks toggle marketing && pnpm ks toggle organizations && pnpm ks toggle i18n

      # Couper un module réécrit `config/features.ts` et `generated/` : c'est
      # attendu. Le contrôle de fin de job compare donc à **cet** état, et non à
      # l'arbre vierge, sans quoi il rougirait pour la commande qu'on vient
      # d'exécuter exprès.
      - name: Photographier l'arbre après configuration
        run: git status --porcelain > /tmp/arbre-attendu.txt

      - name: Typage
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Les barils de `generated/schema/` et les migrations SQL sont versionnés,
      # sans quoi un clone neuf ne pourrait rien générer. Les régénérer ici est
      # ce qui les empêche de mentir : toute divergence — un module activé sans
      # régénération, une table modifiée sans migration — laisse un fichier
      # différent, et le contrôle « l'arbre reste propre » en fin de job échoue
      # en le nommant.
      #
      # `pnpm test` porte les deux mêmes gardes, pour que la divergence se voie
      # avant le push : le dossier des barils comparé à sa régénération, et une
      # régénération **à blanc** des migrations hors de l'arbre versionné. Cette
      # étape-ci reste la seule à attraper les artefacts qu'aucune des deux ne
      # prévoit.
      - name: Régénérer les migrations des modules activés
        run: pnpm db:generate

      # Avant les tests : trois d'entre eux interrogent une vraie base.
      - name: Migrations
        run: pnpm db:migrate

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Installer le navigateur
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours end-to-end
        run: pnpm test:e2e

      # Critère 12 : un fichier généré par un outil ne salit pas l'arbre. C'est
      # aussi la garde de divergence des artefacts de `pnpm db:generate`.
      #
      # Placée **après** les parcours, et pas seulement après le build : c'est
      # `next dev`, démarré par Playwright, qui réécrit `apps/web/AGENTS.md`
      # (bloc `nextjs-agent-rules`) et `next-env.d.ts`. Un contrôle qui tourne
      # avant la commande qui écrit ne couvre pas cette commande — la
      # prochaine montée de Next changerait le texte du bloc sans que rien ne
      # le signale. `git status --porcelain` nomme le fichier fautif, la
      # position unique en fin de job ne coûte donc pas l'attribution.
      - name: L'arbre reste propre après le build et les parcours
        run: |
          git status --porcelain > /tmp/arbre-constate.txt
          if ! diff -u /tmp/arbre-attendu.txt /tmp/arbre-constate.txt; then
            echo "Une commande a modifié des fichiers versionnés au-delà de la configuration demandée :"
            git diff
            exit 1
          fi

      # `pnpm run`, et non `pnpm audit` : la commande interne de pnpm ignorerait
      # les exceptions datées de `.audit-exceptions.json`.
      - name: Audit de dépendances
        run: pnpm run audit

      - name: Traces des parcours en échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.modules }}
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0` : le scan porte sur l'historique, pas sur l'instantané.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # L'action officielle, qui embarque le binaire Go. Le paquet npm homonyme
      # (`gitleaks@1.0.0`) n'est pas cet outil et ne scanne rien : ne pas
      # l'installer.
      #
      # `GITLEAKS_LICENSE` n'est requis que pour un dépôt appartenant à une
      # organisation ; un compte personnel n'en a pas besoin.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
