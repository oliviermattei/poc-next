name: CI

# Tout ce que la Definition of Done exige, sur chaque push et chaque pull
# request. Un seul de ces contrôles en échec fait échouer le workflow : c'est le
# seul sens qu'ait un contrôle bloquant.
on:
  push:
  pull_request:

# Une exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typage, lint, tests, build (modules ${{ matrix.modules }})
    runs-on: ubuntu-latest

    # **Deux configurations, et pas une.** Un module optionnel se coupe, et le
    # dépôt promet qu'un module coupé ne laisse aucune trace : pas de route, pas
    # d'entrée de navigation, pas de migration sur une base fraîche. Une CI qui
    # ne joue qu'une configuration ne vérifie jamais cette moitié-là — et trois
    # revues de suite (s10, s15, s11) ont trouvé des gardes qui ne mordent que
    # dans l'état que la CI ne jouait pas. Une garde qui ne s'exécute jamais
    # dans la configuration où elle mord est de la documentation.
    strategy:
      fail-fast: false
      matrix:
        modules: [tous, socle]

    services:
      # La même image que `docker-compose.yml`, pour que la CI éprouve ce que le
      # développeur exécute. Sans le healthcheck, les migrations démarrent sur
      # une base qui n'écoute pas encore.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Aucun secret : une base jetable, dans le réseau du runner.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # La CI n'envoie aucun email réel : elle capture. Le drapeau est
      # explicite parce que l'absence de clé ne suffit pas à le décider.
      #
      # Mesuré, sans lui, dans l'ordre réel des étapes : migrations, tests
      # unitaires et build passent — ils ne montent aucun mailer, et le schéma
      # d'environnement n'en exige d'aucun processus — puis `pnpm test:e2e`
      # échoue, parce que Playwright démarre l'application et que celle-ci, elle,
      # refuse de démarrer sans avoir dit ce qu'elle fait de ses emails.
      #
      # Au niveau du job, et pas de la seule étape des parcours : y ajouter un
      # jour un secret `RESEND_API_KEY` casserait **toutes** les étapes qui
      # valident l'environnement, la clé et le drapeau étant exclusifs.
      EMAIL_LOCAL_CAPTURE: '1'
      # La CI n'encaisse rien : elle simule. Même règle et même raison que
      # ci-dessus — l'absence de clé ne décide pas, `docs/reliability.md` §2
      # interdisant le repli silencieux qui accorderait des abonnements que
      # personne n'a payés.
      #
      # Mesuré, sans lui : `next dev` affiche `✓ Ready` puis meurt sur « aucun
      # fournisseur de paiement n'est configuré », et `pnpm test:e2e` échoue au
      # démarrage du serveur — dans les **deux** branches de la matrice, le
      # module `billing` restant activé dans la configuration « socle ».
      #
      # Au niveau du job, comme la capture d'emails : c'est ce qui garantit
      # qu'aucune étape ne peut joindre un fournisseur réel, et
      # `tests/env-wiring.test.ts` le vérifie sur ce fichier.
      PAYMENTS_LOCAL_MODE: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` : l'installation échoue si le lockfile diverge du
      # `package.json`, au lieu de le réécrire en silence (socle de sécurité §6).
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # La configuration « socle » : tout ce qui est optionnel est coupé. Le CLI
      # refuse une coupure qui casserait un requis, donc l'ordre compte et
      # l'échec de cette étape est un vrai constat.
      - name: Couper les modules optionnels
        if: matrix.modules == 'socle'
        run: pnpm ks toggle marketing && pnpm ks toggle organizations && pnpm ks toggle i18n

      # Couper un module réécrit `config/features.ts` et `generated/` : c'est
      # attendu. Le contrôle de fin de job compare donc à **cet** état, et non à
      # l'arbre vierge, sans quoi il rougirait pour la commande qu'on vient
      # d'exécuter exprès.
      - name: Photographier l'arbre après configuration
        run: git status --porcelain > /tmp/arbre-attendu.txt

      - name: Typage
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Le contraste de l'`Alert`, mesuré sur les jetons livrés (s49) : la
      # variante `warning` portait le refus de s28 à 1,83 : 1 en mode clair, et
      # rien dans le dépôt ne pouvait le dire. À côté du typage et du lint parce
      # que c'est la même famille — un contrôle statique, sans base, sans
      # navigateur, sans build.
      - name: Contraste
        run: pnpm test:contrast

      # Les barils de `generated/schema/` et les migrations SQL sont versionnés,
      # sans quoi un clone neuf ne pourrait rien générer. Les régénérer ici est
      # ce qui les empêche de mentir : toute divergence — un module activé sans
      # régénération, une table modifiée sans migration — laisse un fichier
      # différent, et le contrôle « l'arbre reste propre » en fin de job échoue
      # en le nommant.
      #
      # `pnpm test` porte les deux mêmes gardes, pour que la divergence se voie
      # avant le push : le dossier des barils comparé à sa régénération, et une
      # régénération **à blanc** des migrations hors de l'arbre versionné. Cette
      # étape-ci reste la seule à attraper les artefacts qu'aucune des deux ne
      # prévoit.
      - name: Régénérer les migrations des modules activés
        run: pnpm db:generate

      # Avant les tests : trois d'entre eux interrogent une vraie base.
      - name: Migrations
        run: pnpm db:migrate

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Installer le navigateur
        run: pnpm exec playwright install --with-deps chromium

      # L'`id:` est ce que l'étape d'archivage interroge : elle ne doit se
      # déclencher que si ce sont **les parcours** qui ont rougi, et pas le
      # lint, le typage ou l'audit. `tests/failure-traces.test.ts` le dérive.
      - name: Parcours end-to-end
        id: parcours
        run: pnpm test:e2e

      # Critère 12 : un fichier généré par un outil ne salit pas l'arbre. C'est
      # aussi la garde de divergence des artefacts de `pnpm db:generate`.
      #
      # Placée **après** les parcours, et pas seulement après le build : c'est
      # `next dev`, démarré par Playwright, qui réécrit `apps/web/AGENTS.md`
      # (bloc `nextjs-agent-rules`) et `next-env.d.ts`. Un contrôle qui tourne
      # avant la commande qui écrit ne couvre pas cette commande — la
      # prochaine montée de Next changerait le texte du bloc sans que rien ne
      # le signale. `git status --porcelain` nomme le fichier fautif, la
      # position unique en fin de job ne coûte donc pas l'attribution.
      - name: L'arbre reste propre après le build et les parcours
        run: |
          git status --porcelain > /tmp/arbre-constate.txt
          if ! diff -u /tmp/arbre-attendu.txt /tmp/arbre-constate.txt; then
            echo "Une commande a modifié des fichiers versionnés au-delà de la configuration demandée :"
            git diff
            exit 1
          fi

      # `pnpm run`, et non `pnpm audit` : la commande interne de pnpm ignorerait
      # les exceptions datées de `.audit-exceptions.json`.
      - name: Audit de dépendances
        run: pnpm run audit

      # **L'artefact était vide depuis l'origine.** Cette étape pointait
      # `playwright-report/`, que cette suite ne produit pas (`reporter: 'list'`)
      # : Playwright écrit ses traces dans son `outputDir`. Et `upload-artifact`
      # qui ne trouve aucun fichier **n'échoue pas** — son `if-no-files-found`
      # vaut `warn` par défaut, `error` étant l'option qui rougit. Chaque échec
      # de parcours a donc produit un archivage vert et rien à télécharger.
      #
      # Le chemin est déclaré une seule fois (`TRACES_OUTPUT_DIRECTORY`,
      # `playwright.config.ts`) et `tests/failure-traces.test.ts` vérifie qu'il
      # vaut celui-ci, `if-no-files-found` compris. Ce n'est **pas** le
      # mécanisme du parcours doré 130 lignes plus bas : celui-là recopie ses
      # traces hors d'un clone qu'il détruit, ce job-ci tourne dans l'arbre.
      #
      # **`failure()` seul serait plus large que ce que l'étape promet** : il est
      # vrai dès qu'une étape quelconque du job a échoué — lint, typage,
      # contraste, `db:generate`, migrations, tests unitaires, build, arbre
      # propre, audit —, et aucune de celles-là n'écrit de trace. Sur une
      # exécution verte des parcours, `test-results/` ne porte que
      # `.last-run.json`, caché, qu'`include-hidden-files` exclut par défaut :
      # avec `if-no-files-found: error`, la majorité des échecs de ce job
      # gagneraient un second rouge trompeur. D'où la conclusion de l'étape des
      # parcours, interrogée par son `id:`.
      #
      # Le nom de l'artefact ne change pas, et c'est un choix de moindre bruit
      # plutôt qu'une compatibilité : par la prémisse même de cette story, tous
      # les artefacts déjà produits sous ce nom sont **vides**, et
      # `retention-days: 7` les efface de toute façon. Le renommer serait de la
      # rotation pour rien ; le contenu, lui, est décrit par le `path:`.
      - name: Traces des parcours en échec
        if: failure() && steps.parcours.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.modules }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  # **Y a-t-il quelque chose à rejouer ?** Ce job minuscule n'existe que pour
  # répondre à cette question, et sa réponse arme le parcours doré ci-dessous.
  #
  # Pourquoi un job entier plutôt qu'un `if:` sur le parcours : `hashFiles` est
  # **interdit dans un `if:` de job**, et l'y écrire ne se contente pas de ne
  # jamais s'armer — GitHub rejette le **fichier entier** (« Unrecognized
  # function: 'hashFiles' »). Ce dépôt n'a qu'un workflow : rejeté, il emporte
  # `quality` (typage, lint, `pnpm test`, `pnpm test:e2e`, audit) **et** le scan
  # de secrets, c'est-à-dire tout ce que le socle de sécurité exige de bloquant,
  # sur chaque poussée. La cause est structurelle : un `if:` de job est évalué
  # avant qu'une machine soit allouée et avant tout `checkout`, donc `hashFiles`
  # n'a aucun espace de travail où résoudre son motif. GitHub n'y autorise que
  # `github`, `needs`, `vars` et `inputs` — d'où `needs` ici.
  #
  # Mesuré par `actionlint` (image `rhysd/actionlint`) sur la version fautive :
  # « calling function "hashFiles" is not allowed here », suivi des huit
  # emplacements où elle l'est, tous des **étapes**.
  # `tests/golden-path.test.ts` garde la règle dans `pnpm test`.
  enregistrements:
    name: Y a-t-il un enregistrement à rejouer ?
    runs-on: ubuntu-latest

    outputs:
      presents: ${{ steps.sonde.outputs.presents }}

    steps:
      - uses: actions/checkout@v7

      # L'empreinte passe par une variable d'environnement plutôt que d'être
      # interpolée dans le script : c'est la forme qui ne peut pas devenir une
      # injection le jour où le motif changerait de source (socle de sécurité).
      # Vide = aucun fichier ne correspond au motif.
      - name: Chercher un enregistrement versionné
        id: sonde
        env:
          EMPREINTE: ${{ hashFiles('tests/fixtures/stripe-events/*.json') }}
        run: |
          if [ -n "$EMPREINTE" ]; then
            echo 'presents=true' >> "$GITHUB_OUTPUT"
          else
            echo 'presents=false' >> "$GITHUB_OUTPUT"
          fi

  parcours-dore:
    name: Parcours doré (clone → premier paiement)
    runs-on: ubuntu-latest

    # **Le critère de succès n°1 du PRD, vérifié à chaque story et non une
    # seule fois.** Un job à part, et pas une étape de `quality` : il clone le
    # dépôt, l'installe et le migre depuis zéro, et la matrice le paierait deux
    # fois pour rien — le parcours a besoin de la configuration livrée.
    #
    # **Il est armé par une donnée, pas par un drapeau** : la condition
    # ci-dessous ne regarde ni une variable ni une étiquette, elle regarde la
    # réponse du job `enregistrements` — s'il existe quelque chose à rejouer.
    # Tant que `tests/fixtures/stripe-events/` ne porte aucun enregistrement, ce
    # job **ne s'exécute pas** ; à la seconde où l'un est versionné, il
    # s'exécute et il est **bloquant** — ni `continue-on-error`, ni régime de
    # repli.
    #
    # Pourquoi pas rouge par construction en attendant : un contrôle requis
    # rouge sur chaque PR, pour une raison étrangère au code de la PR, enseigne
    # à ignorer la CI, et le premier réflexe suivant serait de le rendre non
    # bloquant ou de le passer en `simulated` — rouvrant exactement la porte
    # qu'ADR 048 ferme. Le régime `simulated` est refusé ici, exprès : une CI
    # verte sur des formes que nous avons écrites nous-mêmes aurait cessé de
    # vérifier ce qu'elle prétend vérifier.
    #
    # **Et donc : une CI verte ne prouve pas que ce dépôt ait été éprouvé contre
    # les formes réelles de Stripe.** Il ne l'a jamais été — produire les
    # enregistrements demande une exécution contre des clés de test réelles, un
    # geste humain avec des secrets que le harnais n'a pas.
    # `tests/fixtures/stripe-events/README.md` dit comment les capturer.
    needs: enregistrements
    if: ${{ needs.enregistrements.outputs.presents == 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # La commande crée **sa propre base** sur ce serveur : celle-ci ne sert
      # qu'à savoir où il écoute.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # Le régime de la CI, et le seul qu'elle accepte : rejeu d'événements
      # enregistrés, aucun appel sortant. Un enregistrement manquant fait
      # échouer la commande **en le nommant**, jamais de repli (ADR 048).
      GOLDEN_PATH_PAYMENTS: recorded

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # L'installation de l'arbre courant : elle sert à exécuter la commande,
      # pas à mesurer l'amorçage — celui-ci se fait dans le clone temporaire que
      # la commande crée, avec son propre `pnpm install`.
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer le navigateur
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours doré
        run: pnpm test:golden-path

      # Les traces vivent dans le clone temporaire, que la commande détruit :
      # elle les en recopie ici avant de le supprimer (constat F8 de la revue).
      # Pointer `playwright-report/` à la racine ne téléversait jamais rien.
      #
      # Hors de `test-results/`, qui est l'`outputDir` de Playwright et que
      # `pnpm test:e2e` efface au démarrage. Le chemin est déclaré une seule
      # fois (`FAILURE_TRACES_DIRECTORY`, `scripts/golden-path-regime.ts`) et
      # `tests/golden-path.test.ts` vérifie qu'il vaut celui-ci.
      #
      # **Et cette étape-ci garde `if-no-files-found: warn`**, contrairement à
      # celle des parcours plus haut : `keepFailureTraces`
      # (`scripts/golden-path.ts`) sort sans rien recopier quand Playwright n'a
      # écrit aucun sous-dossier de trace, ce qui arrive légitimement — un échec
      # avant le premier cas, ou hors du navigateur. Ce dossier peut donc ne pas
      # exister sur un échec réel, et `error` y produirait un faux rouge.
      - name: Traces du parcours doré en échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-parcours-dore
          path: test-results-parcours-dore/
          retention-days: 7

  # **Le critère de succès n°4 du PRD, vérifié à chaque story** — « aucune route
  # morte, aucune entrée de nav orpheline, aucune table inutilisée ».
  #
  # Un job à part, et pas une étape de `quality` : la recette clone le dépôt,
  # l'installe et le migre depuis zéro sur une base créée pour l'exécution, et
  # la matrice le paierait deux fois pour rien.
  #
  # **Il est bloquant, et sans condition** : aucun `if:` de niveau job ici. La
  # question « y a-t-il quelque chose à vérifier ? » est répondue par la recette
  # elle-même, qui refuse un balayage vide en nommant les modules coupés qui ne
  # déclarent rien — donc l'armement est une donnée du dépôt, pas une expression
  # de workflow. C'est aussi ce qui évite d'y écrire un `hashFiles` : au niveau
  # d'un job, GitHub rejetterait le **fichier entier**, `quality` et le scan de
  # secrets compris (voir le job `enregistrements` ci-dessus).
  profil-minimal:
    name: Profil minimal (aucune trace d'un module coupé)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # La recette crée **sa propre base** sur ce serveur : celle-ci ne sert
      # qu'à savoir où il écoute.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # **Et rien d'autre.** Aucune variable d'application n'a sa place ici :
      # `cloneEnvironment` retire du sous-processus tout ce que le schéma
      # déclare (`ENV_KEYS`), précisément pour que la recette ne mesure pas la
      # configuration du poste ou du runner. Une `EMAIL_LOCAL_CAPTURE` posée là
      # n'atteindrait aucun processus — la capture des emails du critère 6 vient
      # du `.env` du clone (dérivé de `.env.example`) et de `webServerEnv()`.
      # `DATABASE_URL` échappe à la règle parce que la recette la lit
      # elle-même, avant le clone, pour savoir où PostgreSQL écoute.

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # L'installation de l'arbre courant : elle sert à exécuter la commande,
      # pas à mesurer quoi que ce soit — la recette réinstalle le clone qu'elle
      # crée.
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer le navigateur
        run: pnpm exec playwright install --with-deps chromium

      - name: Recette du profil minimal
        run: pnpm test:minimal-profile

      # Les traces vivent dans le clone temporaire, que la recette détruit :
      # elle les en recopie ici avant de le supprimer. Le chemin est déclaré une
      # seule fois (`MINIMAL_PROFILE_TRACES_DIRECTORY`,
      # `scripts/minimal-profile-rules.ts`) et `tests/minimal-profile.test.ts`
      # vérifie qu'il vaut celui-ci — deux écritures divergentes redonneraient
      # le constat F8 de s25, un téléversement qui pointe sur un dossier
      # inexistant.
      - name: Traces de la recette en échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-profil-minimal
          path: test-results-profil-minimal/
          retention-days: 7

  # **Le critère 7 de s27** — « le pipeline CI construit l'image et échoue si le
  # build de production échoue » — et un pas de plus, parce que s'arrêter à la
  # construction livrerait une garantie creuse : **l'image est démarrée**.
  #
  # Une image qui se construit mais ne démarre pas est le faux vert évident de
  # cette chaîne : la sortie autonome d'un monorepo pnpm ne résout ses paquets
  # `workspace:` qu'à l'exécution, et rien de tout cela ne se voit au
  # `docker build`.
  #
  # Et le démarrage est éprouvé **sans aucune variable** : l'image doit sortir en
  # erreur en nommant ce qui manque. C'est le critère 1 pris à l'envers, et la
  # seule preuve mécanique que l'échappatoire du build — `SKIP_ENV_VALIDATION`,
  # `NEXT_PHASE` — n'a pas fui dans l'étape d'exécution. Mesuré sur la version
  # fautive : le conteneur restait « Up », vert et sans configuration.
  #
  # Un job à part, et sans `if:` : la matrice de `quality` le paierait deux fois
  # pour rien — l'image se construit à partir de la configuration livrée.
  image:
    name: Image de production (construite, puis démarrée)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # **La pile, avant les images.** `docker-compose.prod.yml` porte tout le
      # mécanisme du critère 3 — l'ordre de démarrage, la dépendance
      # `service_completed_successfully`, et la configuration transmise aux
      # conteneurs par interpolation. Sans cette étape, rien en CI ne le charge :
      # une ancre YAML cassée ou un service supprimé ne se verrait qu'au
      # déploiement.
      #
      # Les deux variables sans défaut sont fournies ici : le fichier refuse de
      # se résoudre sans elles, et c'est voulu.
      - name: Valider la pile de production
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Construire l'image de production
        run: docker build --target runner --tag killer-saas-web:ci .

      # L'étape des migrations, que `docker-compose.prod.yml` fait jouer **avant**
      # le basculement du trafic. Elle ne descend pas de `runner` : une image
      # `runner` qui construit ne dit rien de celle-ci.
      - name: Construire l'image de migration
        run: docker build --target migrator --tag killer-saas-migrate:ci .

      - name: L'image refuse de démarrer sans configuration, en la nommant
        run: |
          if docker run --rm killer-saas-web:ci > demarrage.log 2>&1; then
            echo "L'image a démarré sans aucune variable d'environnement : la validation ne s'exécute pas."
            cat demarrage.log
            exit 1
          fi

          cat demarrage.log

          if ! grep -q 'DATABASE_URL' demarrage.log; then
            echo "L'image a bien refusé de démarrer, mais sans nommer la variable manquante."
            exit 1
          fi

  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest

    # Sur un événement `pull_request`, l'action appelle
    # `GET /repos/:owner/:repo/pulls/:number/commits` pour scanner la plage de la
    # demande de fusion. Sans `pull-requests: read`, le jeton par défaut répond
    # **403 « Resource not accessible by integration »** et l'action meurt *avant*
    # de scanner : un job rouge qui n'a rien vérifié. Mesuré sur les demandes de
    # fusion 4, 5, 6 et 7 — rouge à chaque fois sur `pull_request`, verte à chaque
    # fois sur `push`, sur le même commit. Trois stories ont été fusionnées
    # au-dessus de ce rouge.
    permissions:
      contents: read
      pull-requests: read

    steps:
      # `fetch-depth: 0` : le scan porte sur l'historique, pas sur l'instantané.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # L'action officielle, qui embarque le binaire Go. Le paquet npm homonyme
      # (`gitleaks@1.0.0`) n'est pas cet outil et ne scanne rien : ne pas
      # l'installer.
      #
      # `GITLEAKS_LICENSE` n'est requis que pour un dépôt appartenant à une
      # organisation ; un compte personnel n'en a pas besoin.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
