packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"
  - "packages/modules/*"
  - "tooling/*"

# Scripts de post-installation : refusés par défaut (`docs/security.md` §6),
# autorisés au cas par cas. Un cas s'écrit — sans quoi la liste grossit d'un
# nom par erreur d'installation, et le refus par défaut n'existe plus.
#
# - `esbuild` : `postinstall: node install.js` télécharge et installe le binaire
#   natif correspondant à la plateforme, sans lequel le paquet ne fait rien.
#   Le script fait partie du mécanisme de distribution du paquet, pas d'un
#   ajout tiers. Dépendance de développement uniquement (Vite/Vitest et
#   `drizzle-kit`), jamais expédiée à l'exécution.
#
# `unrs-resolver` figurait ici jusqu'à une revue : il n'est **plus** dans
# le graphe de dépendances (zéro occurrence dans `pnpm-lock.yaml`) depuis
# l'abandon d'`eslint-config-next`. Une autorisation qui survit à sa dépendance
# pré-approuve le script d'un paquet que personne n'a examiné, le jour où une
# montée de version le réintroduit par transitivité.
onlyBuiltDependencies:
  - esbuild

# Versions imposées à une dépendance transitive (`pnpm run audit`, issue #77).
# Une ligne n'entre ici que quand le parent **épingle** la version vulnérable,
# si bien qu'aucun rafraîchissement du lockfile ne peut l'en sortir ; chaque
# ligne est portée par son parent et sort de la liste dès qu'il livre le correctif.
#
# - `handlebars` : `eslint-plugin-boundaries@7.2.0` (dernière version publiée)
#   et sa dépendance `@boundaries/elements@3.1.1` l'épinglent tous deux à
#   `4.7.9`, visée par GHSA-8r5x-fm3f-whwj et GHSA-p8wg-vrv2-v86f (critiques) et
#   GHSA-xw65-4hp5-5hc7. `4.7.10` est le correctif, même mineure. Le sélecteur
#   porte sur la plage vulnérable, pas sur un parent : il couvre les deux.
overrides:
  "handlebars@<4.7.10": 4.7.10
